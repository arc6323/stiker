name: Check bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python files
        run: python -m py_compile bot.py ai_generator.py sticker_utils.py
      - name: Import smoke test
        env:
          BOT_TOKEN: "123456:TEST_TOKEN_FOR_IMPORT_ONLY"
        run: python -c "import bot; bot.build_application(); print('StickerMe AI import OK')"
