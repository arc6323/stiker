name: Check bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile bot
        run: python -m py_compile bot.py

      - name: Import smoke test
        env:
          BOT_TOKEN: "123456:TEST_TOKEN_FOR_IMPORT_ONLY"
        run: python -c "import bot; app = bot.build_application(); print('MVP import OK')"
